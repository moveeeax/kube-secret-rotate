name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26", "1.27"]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go }}

      - name: Go version
        run: go version

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: CGO_ENABLED=1 go test -race ./...

      - name: Build
        run: |
          go build -o kube-secret-rotate ./cmd/kube-secret-rotate
          ./kube-secret-rotate --secret x 2>&1 | grep -q "nothing to rotate" || true
          ./kube-secret-rotate 2>&1 | grep -q "secret is required"

      - name: Check formatting
        run: |
          fmt="$(gofmt -l .)"
          if [ -n "$fmt" ]; then echo "gofmt needed on:"; echo "$fmt"; exit 1; fi
