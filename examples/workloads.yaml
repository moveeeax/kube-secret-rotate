# Sample workloads for a manual end-to-end test against a throwaway cluster
# (kind / minikube). Apply this, then run:
#
#   kube-secret-rotate --secret db-creds -n demo --from-file password=./examples/new.env --dry-run
#
# The `api` Deployment (env), `postgres` StatefulSet (volume) and `node-agent`
# DaemonSet (projected volume) are rolled; the `nightly-backup` CronJob (envFrom)
# is stamped for its next run. `frontend` references a different Secret and is
# left alone.
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: v1
kind: Secret
metadata:
  name: db-creds
  namespace: demo
type: Opaque
stringData:
  password: old-value
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-creds
                  key: password
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: demo
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: db
          image: postgres:16-alpine
          volumeMounts:
            - name: creds
              mountPath: /etc/creds
      volumes:
        - name: creds
          secret:
            secretName: db-creds
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: demo
spec:
  selector:
    matchLabels: { app: node-agent }
  template:
    metadata:
      labels: { app: node-agent }
    spec:
      containers:
        - name: agent
          image: busybox:1.37
          command: ["sh", "-c", "sleep infinity"]
          volumeMounts:
            - name: bundle
              mountPath: /etc/bundle
      volumes:
        - name: bundle
          projected:
            sources:
              - secret:
                  name: db-creds
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-backup
  namespace: demo
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: busybox:1.37
              command: ["sh", "-c", "echo backup"]
              envFrom:
                - secretRef:
                    name: db-creds
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          env:
            - name: OTHER
              valueFrom:
                secretKeyRef:
                  name: other-secret
                  key: token
